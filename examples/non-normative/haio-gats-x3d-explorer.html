<link rel="icon" href="data:,">
<script defer src="https://cdn.jsdelivr.net/npm/x_ite@16.5.0/dist/x_ite.min.js" integrity="sha384-zWEqBzUvPfAWJdZmshc1Ku1djM3avxduUwuOTDd9jjvtdxcy8f9eC9PAZyeU3YgO" crossorigin="anonymous"></script>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const ROOT='https://github.com/paulhugel/haio-gats/blob/main/spec/HAIO-GATS-v0.1.0.md';
const PDF='https://github.com/paulhugel/haio-gats/blob/main/spec/HAIO-GATS-v0.1.0.pdf';
const sections={HS:'#51-human-supervisory-control',AU:'#52-authority-and-approval',ID:'#53-identity-delegation-and-role-separation',EV:'#54-event-and-provenance-model',CT:'#55-cryptographic-transparency-and-custody',PS:'#56-privacy-security-and-disclosure',RC:'#57-continuity-and-recovery'};
const families=[['HS','Human supervision','Accountable, effective oversight'],['AU','Authority & approval','Bounded grants and distinct gates'],['ID','Identity & roles','Authentication and separation'],['EV','Events & provenance','Traceable records and claims'],['CT','Transparency & custody','Signed, checkable registration'],['PS','Privacy & security','Controlled disclosure and keys'],['RC','Continuity & recovery','Durable state and reconciliation']];
const rawRequirements=[
['HS-01','Supervisor designation','G','Identify exactly one accountable, authenticated Human Supervisor before giving an AI agent authority.'],
['HS-02','Informed decision','G','Present the action, purpose, resources, authority, outcome, risks, evidence, criteria, and rollback/containment before consequential approval.'],
['HS-03','Effective control','G','Provide approve, reject, constrain, pause, interrupt, override, reversal where possible, and agent-independent safe halt; declare halt latency bounds.'],
['HS-04','Live monitoring','G','Show actors, grants, approvals, completed actions, exceptions, failed registrations, consumed scope, and emergency-stop status with bounded delay.'],
['HS-05','Automation bias','G','Present uncertainty, conflicting evidence, verification state, and limitations to support meaningful supervisory judgment (SHOULD).'],
['HS-06','Supervisory decisions','G','Record each approval, denial, constraint, override, intervention, and halt as distinct attributed events; deny when required approval is absent.'],
['AU-01','Authority grant object','G','Specify grant and actor IDs, roles, actions, resources, constraints, effective and expiry terms, required evidence, gates, and prohibitions.'],
['AU-02','Authenticated binding','G','Bind grants to authenticated actor and operation; fail closed on missing, expired, revoked, ambiguous, or inconsistent authority.'],
['AU-03','Least authority','G','Keep action and resource scope minimal; read/discovery access must never imply mutation permission.'],
['AU-04','Distinct approval gates','G','Separate mutation, promotion, publication, destructive action, scope expansion, and residual-risk gates; bind receipts to exact transitions and prevent replay.'],
['AU-05','Scope drift','G','Stop and obtain a new human decision when the actor, action, resource, risk, or expected effect exceeds the current grant.'],
['ID-01','Identity binding','G','Authenticate every actor; ensure the claimed actor matches the credential-bound subject. A display name or schema-only match is insufficient.'],
['ID-02','Bounded delegation','G','Record who delegated to whom, operation, role, grant, time limits, and revocation; never delegate greater authority.'],
['ID-03','Separation of duties','G','Use distinct executors, verifiers, and promoters for consequential operations (SHOULD); justify and control any overlap.'],
['ID-04','Honest verification labels','G','Never label a self-check, generated summary, hash, signature, or test run as independent verification; record verifier relationship and examined evidence.'],
['ID-05','Independent verifier','A','An independent verifier must assess the result and primary evidence against explicit acceptance criteria.'],
['EV-01','Automatic event capture','G','Record proposals, decisions, invocations, mutations, exceptions, verification, promotions, reversals, recovery, and halts automatically.'],
['EV-02','Minimum event envelope','G','Every material record contains the required event fields, controlled unknown/not_applicable semantics, and enforceable timestamp validation.'],
['EV-03','Provenance mapping','G','Represent actors, activities, artifacts, derivation, delegation, and roles in W3C PROV or a documented lossless mapping (SHOULD).'],
['EV-04','Evidence truth status','G','Classify material claims at least as verified observation, inference, hypothesis, or unknown; append superseding corrections instead of rewriting history.'],
['EV-05','Linked evidence','G','Bind artifacts and external states to stable IDs and, where appropriate, digests or independently checkable references.'],
['EV-06','Duplicate handling','G','Give submissions stable IDs; identical replay has at most one effect; conflicting reuse fails closed with an attributed conflict event.'],
['CT-01','Signed statements','T','Produce authenticated signed statements for consequential events binding issuer, subject, type, and content or digest.'],
['CT-02','Registration policy','T','Authenticate issuer, enforce registration policy, add accepted statements to a verifiable structure, and issue inclusion receipts.'],
['CT-03','Reproducible checks','T','Keep the statements, policies, trust anchors, and collateral needed to reproduce registration checks.'],
['CT-04','Append-only history','T','Preserve accepted statement order; record corrections and revocations as new linked statements rather than silent edits.'],
['CT-05','Non-equivocation','T','Make consistent-history evidence available to relying parties and declare the verifiable structure and receipt profile.'],
['CT-06','Independent custody','A','Maintain checkpoints or statements under independently controlled custody; an operator-held head digest alone is insufficient.'],
['CT-07','Separate proof claims','T','Distinguish signature, identity, policy acceptance, inclusion, consistency, custody, truth, authority, and verification; never conflate them.'],
['PS-01','Minimize sensitive data','G','Keep only accountability-relevant data; never place secrets, tokens, or unnecessary personal information in signed statement payloads.'],
['PS-02','Separated views','G','Protect sensitive evidence independently of sanitized disclosure views, retaining stable authorized references.'],
['PS-03','Accountable evidence access','G','Log sensitive evidence access, policy and trust-anchor administration, and key management with separation of duties.'],
['PS-04','Compromised key response','T','Document key-compromise detection, notification, revocation, historical interpretation, recovery, and reissuance.'],
['RC-01','Retention policy','G','Specify retention by event, purpose, obligations, confidentiality, and recovery need; log expiry/deletion without falsifying prior inclusion.'],
['RC-02','Durable publication','G','Define event-storage atomicity and action-success/event-failure handling; at T/A also cover checkpoint and receipt failures.'],
['RC-03','Backup and restore','G','Preserve ordering and policies; T/A add statements, receipts, anchors, and key history; A adds independent checkpoints and restore-test evidence.'],
['RC-04','Recovery reconciliation','A','Require independent reconciliation of recovered state against independently held checkpoints before normal operations resume.']
];
const requirements=rawRequirements.map(r=>({id:r[0],title:r[1],level:r[2],desc:r[3],family:r[0].slice(0,2)}));
const tests=[
['T-01','Missing supervisor / approval','G','Deny an unapproved consequential action; preserve attributable denial and policy evidence.','HS-01, HS-06, AU-04'],
['T-02','Outside-grant action','G','Detect scope drift, stop execution, and request a new human decision.','AU-02, AU-05'],
['T-03','Emergency halt','G','Demonstrate authenticated safe halt within the declared latency; record intervention.','HS-03, HS-06'],
['T-04','Duplicate / conflicting identifier','G','Identical replay has at most one effect; conflicting reuse fails closed.','EV-06'],
['T-05','Executor self-check','G','Present executor check as a self-check, not independent verification.','ID-04'],
['T-06','History tampering / rechain','T','T: receipt/consistency check detects rewriting. A: additionally detect against an independent checkpoint.','CT-04, CT-05; CT-06 at A'],
['T-07G','Expired or revoked grant','G','Reject invalid grant, credential, or stale authorization policy with a reason.','AU-02'],
['T-07T','Forged issuer / stale registration policy','T','Fail closed and attribute registration denial.','CT-02'],
['T-08','Unauthorized disclosure','G','Sanitized public view retains references without exposing secrets or restricted evidence.','PS-01, PS-02'],
['T-09','Stale backup recovery','A','Detect divergence from independently anchored events; reconcile before resumption.','CT-06, RC-03, RC-04'],
['T-10','Action succeeds, registration fails','T','Expose inconsistent state; invoke containment or recovery.','RC-02'],
['T-11','Key rotation / compromise','T','Audit history, revocation point, replacement keys, and notifications.','PS-04'],
['T-12G','Correct an earlier false claim','G','Append a linked superseding event; keep original.','EV-04'],
['T-12T','Correct a registered false claim','T','Register a new statement; original and inclusion proof remain detectable.','EV-04, CT-04']
].map(x=>({id:x[0],title:x[1],level:x[2],desc:x[3],refs:x[4]}));
const stages=[
['PROPOSED','A candidate operation exists, not an authorization.','Capture the proposal and make its purpose, risks, and requested effect reviewable.',['EV-01','HS-02']],
['SCOPED','The operation is bounded to resources, actions, actors, and constraints.','Read/discovery scope does not silently authorize modification.',['AU-01','AU-03']],
['AUTHORIZED','The applicable authority and human decision permit the specific next transition.','Approval for mutation does not authorize publication or any other distinct gate.',['AU-02','AU-04','HS-06']],
['EXECUTING','An authenticated executor performs the approved work.','A halt must work without the agent voluntarily cooperating; drift stops work.',['HS-03','AU-05','ID-01']],
['EVIDENCED','Material effects and supporting records have been captured.','Evidence must identify what happened and link primary artifacts or state.',['EV-01','EV-02','EV-05']],
['VERIFIED','A named verifier evaluates outcome against criteria.','At G/T a recorded verification need not be independent; at A it must be independent.',['ID-04','ID-05']],
['PROMOTION-AUTHORIZED','A distinct decision permits promotion or publication.','Prior execution approval cannot be reused to pass this gate.',['AU-04']],
['PROMOTED','A separately authorized actor changes the promoted or published state.','Promotion has its own attributable event and evidence.',['AU-04','EV-01','ID-03']],
['REVERIFIED','The resulting promoted state is checked again.','The post-promotion check supports closure; it is not proof of unrecorded facts.',['EV-01','ID-04']],
['CLOSED','Operation reaches an accountable terminal state.','Preserve records, evidence status, and applicable receipt/custody obligations.',['EV-04','RC-01']]
];
const demo=[
['PROPOSAL','Agent requests a repository modification.','The proposed file, intended change, risk, criteria, and rollback plan are presented.','No authority has been granted simply because the AI proposed work.'],
['MUTATION GATE','Supervisor considers the exact mutation.','The policy decision point checks actor, grant, scope, and a specific human approval receipt.','If approval is absent, ambiguous, expired, or replayed, deny and record the reason.'],
['EXECUTION & REVIEW','Executor acts and verifier evaluates evidence.','Changes and evidence are recorded. A separate verifier checks acceptance criteria; self-check is clearly labeled.','Any scope drift, failed log or registration, or emergency stop forces containment.'],
['PROMOTION GATE','Supervisor considers the distinct publication or merge decision.','Promoter must obtain authorization for this transition; previous mutation approval is not sufficient.','After promotion, the resulting state is reverified and the operation can close.']
];
const levels={G:1,T:2,A:3};
let state={view:'flow',level:'T',family:'all',query:'',expanded:null,stage:0,scenario:0,evidenceMode:'claims',flowStage:0,flowException:null,flowMode:'inside',flowLayer:'all',flowObject:null,flowYaw:0};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const familyName=id=>families.find(f=>f[0]===id)?.[1]||id;
const sectionUrl=id=>ROOT+(sections[id.slice(0,2)]||'');
const cta=(name,label)=>`<button class="btn secondary" data-view="${name}">${label} →</button>`;
const refsMarkup=ids=>`<div class="refs">${ids.map(x=>`<span class="ref">${esc(x)}</span>`).join('')}</div>`;
const banner=(title,sub,eyebrow='SPECIFICATION EXPLORER')=>`<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${sub}</p></div><a class="linkbtn" href="${PDF}" target="_blank" rel="noopener noreferrer">↗ &nbsp;Authoritative PDF</a></div>`;
function frame(body){let nav=[['overview','Overview','⌂'],['flow','3D cycle','◉'],['lifecycle','Lifecycle','↝'],['controls','Control library','▦'],['conformance','Conformance','◇'],['evidence','Evidence & trust','◈']];$('app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="logo"><div class="logo-icon">H</div><div><b>HAIO-GATS</b><small>Visual specification explorer</small></div></div><div><div class="nav-label">EXPLORE THE SPEC</div><nav class="nav" aria-label="Primary navigation">${nav.map(([id,label,ic])=>`<button class="nav-btn ${state.view===id?'active':''}" data-view="${id}" aria-label="${label}" aria-current="${state.view===id?'page':'false'}"><span style="font-size:19px;line-height:1;width:21px;text-align:center" aria-hidden="true">${ic}</span><span class="nav-text">${label}</span><span class="nav-dot"></span></button>`).join('')}</nav></div><div class="sidebar-foot"><strong>Research draft · v0.1.0</strong>Educational, read-only interface.<br>Not a conformity certificate or enforcement system.<br><a href="${ROOT}" target="_blank" rel="noopener noreferrer">Inspect source ↗</a></div></aside><main class="main"><header class="topbar"><div class="crumb">REFERENCE / <strong>${nav.find(n=>n[0]===state.view)[1]}</strong></div><div class="topmeta"><span class="pill blue">v0.1.0</span><span class="pill amber">PUBLIC DRAFT</span><span class="pill">READ ONLY</span></div></header><div class="content">${body}<footer class="footer-note">Source: <a href="${ROOT}" target="_blank" rel="noopener noreferrer">HAIO-GATS v0.1.0 Markdown edition</a>. Authored by Paul Garrett Hugel, 16 Sep 2026, CC BY 4.0. The deposited PDF is authoritative if the Markdown and PDF differ. The Markdown also includes a correction-candidate notice. This UI paraphrases and organizes source material for understanding; consult the specification for normative language. No actions, approvals, conformance checks, or evidence registrations are executed by this prototype.</footer></div></main></div>`;}
function overview(){return `${banner('Governance you can navigate.','A visual map of how HAIO-GATS keeps humans in control of consequential AI actions—and makes the resulting evidence independently checkable.')}<div class="hero"><div><div class="tag">● HUMAN-SUPERVISED AGENTIC OPERATIONS</div><h2>Operational authority is granted, not assumed.</h2><p>HAIO-GATS connects a real human decision to a bounded actor, an attributable action, verified evidence, and (at higher levels) transparent cryptographic registration. A log or a signature alone is never enough.</p></div><div class="hero-diagram"><div class="diagram-frame"><div class="diagram-head">A governed operation at a glance</div><div class="diagram-human">Human Supervisor<br><span style="font-size:10px;font-weight:500">owns approval, intervention, and safe halt</span></div><div class="diagram-arrow">↓</div><div class="diagram-row"><div class="diagram-chip">Authority<br>grant</div><div class="diagram-chip">Policy<br>decision</div><div class="diagram-chip">Approval<br>gate</div></div><div class="diagram-arrow">↓</div><div class="diagram-row"><div class="diagram-chip">Executor</div><div class="diagram-chip">Verifier</div><div class="diagram-chip">Publisher</div></div><div class="diagram-footer">↓ &nbsp; Event evidence &nbsp; → &nbsp; transparency &amp; custody</div></div></div></div><div class="stats"><div class="stat"><b>37</b><span>Normative controls</span><small>7 requirement families</small></div><div class="stat"><b>3</b><span>Cumulative levels</span><small>G → T → A</small></div><div class="stat"><b>10</b><span>Lifecycle stages</span><small>With exceptional exits</small></div><div class="stat"><b>14</b><span>Conformance tests</span><small>Level-dependent evidence</small></div></div><div class="sectionline"><div><h2>Three questions the specification answers</h2><p>Separate operational control from observation and proof.</p></div></div><div class="grid3"><div class="card"><div class="mini-icon">01</div><h3>Who is allowed to act?</h3><p>Exactly one accountable human supervisor, authenticated actors, scoped grants, distinct approval gates, and an independent way to halt.</p><div style="margin-top:16px"><button class="inlinebtn" data-view="controls" data-family="HS">Explore control requirements →</button></div></div><div class="card"><div class="mini-icon teal">02</div><h3>What happened, and when?</h3><p>An explicit state model links proposals, approvals, actions, evidence, verification, and publication without reusing old permissions.</p><div style="margin-top:16px"><button class="inlinebtn" data-view="lifecycle">Walk the lifecycle →</button></div></div><div class="card"><div class="mini-icon purple">03</div><h3>What can be independently checked?</h3><p>Authenticated provenance plus transparent registration, consistent-history proofs, and stronger custody and verification at Level A.</p><div style="margin-top:16px"><button class="inlinebtn" data-view="evidence">Explore evidence layers →</button></div></div></div><div class="sectionline"><div><h2>The accountability chain</h2><p>Each link answers a distinct question. None substitutes for the others.</p></div></div><div class="feature-chain">${['Identity','Authority','Human decision','Action','Primary evidence','Verification','Transparent registration'].map((x,i)=>`${i?'<span class="next">→</span>':''}<span class="node ${i===3?'action':''} ${i===6?'final':''}">${x}</span>`).join('')}</div><div class="callout"><b>Critical distinction:</b> Cryptographic integrity, signatures, and valid inclusion receipts do not establish the accuracy of a claim, the legitimacy of an approval, or independence of verification. The stronger levels add independently checkable properties; they do not make AI actions inherently safe.</div><div class="sectionline"><div><h2>Try a governed operation</h2><p>A simplified, illustrative repository-change scenario—not real approval or execution.</p></div></div><div class="split"><div class="demo-box"><div class="demo-label">EXAMPLE ${state.scenario+1} OF 4</div><div class="progressline">${demo.map((_,i)=>`<span class="${i<=state.scenario?'done':''}"></span>`).join('')}</div><h3>${demo[state.scenario][0]}</h3><p>${demo[state.scenario][1]} ${demo[state.scenario][2]}</p><div class="actionrow"><button class="btn secondary" data-scenario="prev" ${state.scenario===0?'disabled':''}>← Previous</button><button class="btn" data-scenario="next">${state.scenario===3?'Restart example':'Next gate →'}</button></div><div class="readout"><strong>Fail-closed rule:</strong> ${demo[state.scenario][3]}</div></div><div class="card"><div class="eyebrow">WHY IT MATTERS</div><h3 style="font-size:20px">A single “approved” button is not sufficient.</h3><p>Mutation, commit/promotion, publication/deployment, destructive actions, material scope expansion, and residual-risk acceptance require distinct gates. An approval receipt authorizes exactly the specified transition—not every future action.</p><div class="refs"><span class="ref">AU-04</span><span class="ref">HS-02</span><span class="ref">HS-06</span></div><div style="margin-top:19px">${cta('lifecycle','Inspect the complete state model')}</div></div></div>`}
function lifecycle(){let s=stages[state.stage];return `${banner('The governed operation lifecycle','Ten named stages describe a normal operational path. Every transition identifies its actor, authority, evidence, and human decision; exceptional exits remain available.','OPERATIONAL STATE MODEL · §6')}<div class="sectionline"><div><h2>Click a stage to inspect its meaning</h2><p>Selection reveals a plain-language interpretation and related normative control IDs.</p></div><span class="smallmeta">${state.stage+1} / 10</span></div><div class="step-grid">${stages.map((x,i)=>`<button class="step ${state.stage===i?'active':''}" data-stage="${i}" aria-pressed="${state.stage===i}"><span class="num">${String(i+1).padStart(2,'0')}</span><strong>${x[0].replaceAll('-','-<wbr>')}</strong><span class="sdot"></span></button>`).join('')}</div><div class="sectionline"><div><h2>Selected transition context</h2></div></div><div class="split"><div class="detail-pane"><div class="label">STAGE ${String(state.stage+1).padStart(2,'0')}</div><h3>${s[0]}</h3><p>${s[1]}</p><div class="label">Interpretation / review prompt</div><p style="margin-top:8px">${s[2]}</p>${refsMarkup(s[3])}<div class="row" style="margin-top:20px"><button class="btn secondary" data-stage="${Math.max(0,state.stage-1)}" ${state.stage===0?'disabled':''}>← Previous</button><button class="btn" data-stage="${(state.stage+1)%stages.length}">${state.stage===9?'Return to proposal':'Next stage →'}</button></div></div><div class="card"><div class="eyebrow">GUARDRAILS APPLY THROUGHOUT</div><h3>Every state has an exception path.</h3><p>From any stage, operations must be able to enter one of the following exception states when appropriate:</p><div class="failstates" style="margin-top:16px"><span>PAUSED</span><span>DENIED</span><span>FAILED</span><span>HALTED</span><span>RECOVERY REQUIRED</span></div><div class="callout" style="margin-top:18px">At G/T, “VERIFIED” records a declared verification result; at A, independent verification is additionally required (ID-05).</div></div></div><div class="sectionline"><div><h2>Three approvals that cannot be conflated</h2></div></div><div class="grid3"><div class="card"><span class="mini-icon">1</span><h3>Mutation</h3><p>Does the current actor have permission to perform this exact state-changing action?</p></div><div class="card"><span class="mini-icon teal">2</span><h3>Promotion / publication</h3><p>Has a separate gate authorized commit, merge, deployment, transmission, or release?</p></div><div class="card"><span class="mini-icon purple">3</span><h3>Scope or risk change</h3><p>Has the human approved any material expansion or residual-risk acceptance?</p></div></div><div class="small-note">Normative source: <a href="${ROOT}#6-operational-state-model" target="_blank" rel="noopener noreferrer">§6</a> and <a href="${sectionUrl('AU-04')}" target="_blank" rel="noopener noreferrer">AU-04</a>. Stage descriptions above are explanatory paraphrases, not new normative obligations.</div>`}
function controls(){const eligible=requirements.filter(r=>levels[r.level]<=levels[state.level]&&(state.family==='all'||r.family===state.family)&&(!state.query||(`${r.id} ${r.title} ${r.desc} ${familyName(r.family)}`).toLowerCase().includes(state.query.toLowerCase())));return `${banner('Explore all 37 controls','Find the control that answers your question. Filter by control family, cumulative conformance level, or requirement ID.','NORMATIVE REQUIREMENTS · §5')}<div class="sectionline"><div><h2>Filter by requirement family</h2><p>The seven families cover the entire v0.1.0 normative-control catalog.</p></div><span class="smallmeta">${eligible.length} visible</span></div><div class="family-legend"><button class="family-tile ${state.family==='all'?'active':''}" data-family="all"><b>ALL</b><span>Entire catalog</span></button>${families.map(f=>`<button class="family-tile ${state.family===f[0]?'active':''}" data-family="${f[0]}"><b>${f[0]} · ${f[1]}</b><span>${requirements.filter(x=>x.family===f[0]).length} controls</span></button>`).join('')}</div><div class="toolbar"><label class="sr-only" for="control-search">Search requirements</label><input class="searchbox" id="control-search" type="search" placeholder="Search ID or text, e.g. AU-04, halt, custody…" value="${esc(state.query)}"><div class="chips" aria-label="Conformance level filter">${[['G','Governed'],['T','Transparent'],['A','Assured']].map(x=>`<button class="chip ${state.level===x[0]?'active':''}" data-level="${x[0]}" aria-pressed="${state.level===x[0]}">${x[0]} · ${x[1]}</button>`).join('')}</div></div><div class="small-note" style="margin:-3px 0 13px">Showing requirements applicable through <b>Level ${state.level}</b> (cumulative). Level G: 27; Level T: 34; Level A: 37. Summaries are paraphrases. Open the source for MUST/SHOULD wording.</div>${eligible.length?`<div class="requirements-list">${eligible.map(r=>`<article class="req"><button class="req-head" data-req="${r.id}" aria-expanded="${state.expanded===r.id}"><span class="req-id">${r.id}</span><span class="req-body"><b>${r.title}</b><span>${r.desc}</span></span><span class="level-tag ${r.level.toLowerCase()}">${r.level}</span></button>${state.expanded===r.id?`<div class="req-more"><strong>Control family:</strong> ${familyName(r.family)}. <strong>Minimum level:</strong> ${r.level}.<br><strong>Interpretive caution:</strong> This card summarizes the intent; inspect the normative specification for the exact conditions and exceptions.<br><a href="${sectionUrl(r.id)}" target="_blank" rel="noopener noreferrer">Read ${r.id} in the source ↗</a></div>`:''}</article>`).join('')}</div>`:'<div class="empty">No controls match the current filters. Try another family, level, or search term.</div>'}`}
function conformance(){const reqs=requirements.filter(x=>levels[x.level]<=levels[state.level]);const ts=tests.filter(x=>levels[x.level]<=levels[state.level]);const added=state.level==='G'?'Baseline governance controls':state.level==='T'?'Adds CT-01 through CT-05, CT-07, and PS-04':'Adds ID-05, CT-06, and RC-04';return `${banner('Understand the three conformance levels','Conformance is cumulative. Higher levels do not replace the foundational duties and tests below them; every applicable requirement needs evidence.','CONFORMANCE · §§3 & 7')}<div class="level-grid">${[['G','Governed','Human oversight, grants, roles, events, privacy, continuity.'],['T','Transparent','Adds signed statements, transparent receipts, non-equivocation, and key-compromise response.'],['A','Assured','Adds independent verification, custody, and recovery reconciliation.']].map(l=>`<button class="level-card ${l[0].toLowerCase()} ${state.level===l[0]?'active':''}" data-level="${l[0]}" aria-pressed="${state.level===l[0]}"><span class="bigletter">${l[0]}</span><strong>Level ${l[0]} · ${l[1]}</strong><p>${l[2]}</p></button>`).join('')}</div><div class="card" style="margin-top:15px"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">SELECTED REQUIREMENT SCOPE</div><h3 style="font-size:22px;margin:0">Level ${state.level} <span style="font-weight:550;color:#8a98aa">— ${reqs.length} controls</span></h3><p>${added}</p></div><span class="pill blue">${ts.length} required test IDs</span></div><div class="scope-meter" aria-label="27 G controls, 7 additional T controls, 3 additional A controls"><span class="meter-g" style="width:${27/37*100}%"></span><span class="meter-t" style="width:${state.level==='G'?0:7/37*100}%"></span><span class="meter-a" style="width:${state.level==='A'?3/37*100:0}%"></span></div><div class="row"><span class="ref">G baseline · 27</span>${state.level!=='G'?'<span class="ref">T increment · 7</span>':''}${state.level==='A'?'<span class="ref">A increment · 3</span>':''}</div><div class="small-note">This represents <b>required coverage</b>, not tested readiness, measured compliance, or certification. At Level A, test T-06 also gains the independent-custody check (CT-06).</div></div><div class="sectionline"><div><h2>Conformance tests at the selected level</h2><p>Each test has a prescribed challenge and required evidence. These are not executed in this explorer.</p></div><span class="smallmeta">${ts.length} of 14</span></div><div class="test-list">${ts.map(t=>`<article class="test"><span class="test-code">${t.id}</span><div><div class="row" style="justify-content:space-between;align-items:flex-start"><h3>${t.title}</h3><span class="level-tag ${t.level.toLowerCase()}">${t.level}</span></div><p>${t.desc}</p><div class="refs"><span class="ref">${esc(t.refs)}</span></div></div></article>`).join('')}</div><div class="callout"><b>Conformance evidence is not a checkbox:</b> The specification requires requirement-by-requirement evidence for every applicable normative duty, evidence for every test at or below the claimed level, and level-based reasons when reporting higher-level tests as <code>not_applicable</code>.</div>`}
const fieldGroups=[['Identity & attribution',['event_id','operation_id','event_type','recorded_at','actor_id','actor_type','role','human_supervisor_id']],['Authority & decisions',['authority_grant_id','policy_id','policy_version','action','resource_scope','decision','decision_basis']],['Artifact & evidentiary links',['input_refs','output_refs','truth_status','prior_event_id','verifier_id','supersedes_event_id']],['Transparency & data handling',['statement_id','receipt_ref','confidentiality','retention']]];
function evidence(){return `${banner('An evidence system—not just an audit log','HAIO-GATS distinguishes actor authenticity, lawful scope, human approval, event provenance, cryptographic registration, and independent review.','EVENTS / PROVENANCE / TRANSPARENCY · §§5.4–5.7')}<div class="sectionline"><div><h2>Eight claims, eight different questions</h2><p>Stronger claims require additional evidence; lower-level proofs must never be relabeled as stronger ones.</p></div></div><div class="evidence-stages">${[['01','Actor identity','Who is this authenticated signer or actor?','G'],['02','Current authority','Was this actor allowed to perform this operation?','G'],['03','Human decision','Was the exact transition authorized?','G'],['04','Action & evidence','What actually changed, with what attributable primary evidence?','G'],['05','Verification','Who evaluated the outcome, against which criteria?','G · A independent'],['06','Signed statement','Was a statement cryptographically bound to issuer and content?','T'],['07','Inclusion & consistency','Was it registered and is the sequence consistent?','T'],['08','Independent custody','Can another custodian anchor/reconcile the history?','A']].map(e=>`<article class="ev-stage ${e[3].startsWith('A')?'a':''}"><div class="sequence">CLAIM ${e[0]}</div><h3>${e[1]}</h3><p>${e[2]}</p><div class="cond">${e[3]==='G'?'Level G':e[3]==='T'?'Level T+':e[3]==='A'?'Level A':'G/T recorded; A independent'}</div></article>`).join('')}</div><div class="sectionline"><div><h2>Every material event carries a minimum envelope</h2><p>25 named fields from EV-02, organized for readability.</p></div><a class="linkbtn" href="${sectionUrl('EV-02')}" target="_blank" rel="noopener noreferrer">↗ EV-02 source</a></div><div class="evidence-fields">${fieldGroups.map(g=>`<section class="field-card"><h3>${g[0]} · ${g[1].length}</h3>${g[1].map(x=>`<code>${x}</code>`).join('')}</section>`).join('')}</div><div class="small-note"><b>Important schema rules:</b> Use <code>unknown</code> when an applicable value cannot be determined; <code>not_applicable</code> is restricted to declared conditions. <code>action</code> and <code>resource_scope</code> may never be <code>not_applicable</code>. At G, <code>statement_id</code> and <code>receipt_ref</code> may be <code>not_applicable</code>. A bare JSON Schema <code>format</code> annotation is not sufficient timestamp validation.</div><div class="sectionline"><div><h2>Evidence status is not the same as cryptographic status</h2></div></div><div class="distinction"><div class="card"><div class="eyebrow" style="color:#0a887b">CLAIM STATUS · EV-04</div><h3>How well is the statement supported?</h3><p>Verified observation, inference, hypothesis, unknown, stale, and superseded help distinguish evidence quality and currency. An earlier claim is corrected with a linked new event, not silently overwritten.</p>${refsMarkup(['verified','inferred','hypothesis','unknown','stale','superseded'])}</div><div class="card"><div class="eyebrow" style="color:#b78036">TRANSPARENCY STATUS · CT-07</div><h3>What does the infrastructure actually prove?</h3><p>A signature, policy acceptance, inclusion receipt, consistency proof, independent checkpoint, and independent verification are separate assertions. No one of them proves that the underlying statement is true.</p>${refsMarkup(['signature','inclusion','consistency','custody','accuracy'])}</div></div><div class="callout"><b>Privacy limitation:</b> Tamper-evident logs can also become surveillance infrastructure. The specification requires minimization, access-controlled restricted evidence, sanitized disclosure views, accountable access, retention rules, and key-compromise procedures at their applicable levels.</div>`}

let flowScene=null,flowPlaying=false,flowLast=0,flowElapsed=0,flowRaf=0;
function flow(){const d=flowDetailData();return `${banner('Walk the complete process','Travel from start to finish. Select a labeled 3D object to inspect a control, event field, or conformance test.','ILLUSTRATIVE X3D LIFECYCLE · PDF §§5–7')}<div class="flow-intro"><div class="card"><h3>You are inside the process</h3><p>The camera starts before <b>PROPOSED</b>, facing the complete straight route. Press Play to move forward past the labeled blocks, or step and scrub to a state. The gold marker identifies the selected state.</p></div><div class="card"><h3>76 labeled parameter objects</h3><p>Explore <b>37 controls</b>, <b>25 event fields</b>, and <b>14 conformance tests</b> as selectable geometry. Side-lane position is for browsing only; it does not mean a parameter applies only at that stage.</p></div></div><div class="flow-mode" aria-label="Camera view"><button data-flow-mode="inside" class="${state.flowMode==='inside'?'active':''}" aria-pressed="${state.flowMode==='inside'}">Inside the process</button><button data-flow-mode="overview" class="${state.flowMode==='overview'?'active':''}" aria-pressed="${state.flowMode==='overview'}">Full overview</button><span class="flow-view-note">Play moves the inside viewpoint forward; step and scrub jump to a stage.</span></div><div class="flow-layers" aria-label="Parameter gallery"><strong style="font-size:11px;margin-right:3px">Show geometry:</strong>${[['control','Controls · 37'],['field','Event fields · 25'],['test','Tests · 14'],['all','All · 76']].map(([id,name])=>`<button data-flow-layer="${id}" class="${state.flowLayer===id?'active':''}" aria-pressed="${state.flowLayer===id}">${name}</button>`).join('')}</div><div class="flow-turn" aria-label="Look along the process route"><button data-flow-turn="left" aria-label="Turn 45 degrees left">↶ Turn left</button><button data-flow-turn="reset" aria-label="Face forward">Face forward</button><button data-flow-turn="right" aria-label="Turn 45 degrees right">Turn right ↷</button><span id="flow-bearing" aria-live="polite">Facing forward · 0°</span></div><div class="flow-scene"><x3d-canvas id="flow-canvas" contentScale="auto" update="auto" aria-label="Immersive straight timeline with labeled blocks ahead and on both sides">${FLOW_X3D}<p class="flow-no3d">3D needs WebGL and X_ITE. The complete text catalog below remains available.</p></x3d-canvas><div class="scene-status" id="scene-status" role="status">Loading 3D scene…</div><div class="flow-help">Look left or right, then press Play to pass the blocks. Select a labeled block to inspect it. The text controls below support keyboard navigation.</div></div><div class="flow-key"><span>Blue: normal stages</span><span class="gate">Gold: approval gates</span><span class="exception">Red: exceptions</span><span class="control">Cyan: control blocks</span><span class="field">Violet: event fields</span><span class="test">Gold blocks: conformance tests</span></div><p class="flow-scene-caption">Normal states span a straight start-to-finish route. Controls, event fields, tests, and exceptions stand beside it as navigational illustrations. Their positions do not state when a requirement applies, whether a field is present in a deployment, or whether a test has passed.</p><div class="flow-controls" aria-label="Illustrative time navigation"><button class="btn secondary" data-flow-action="previous" aria-label="Previous state">← Previous</button><button class="btn" id="flow-play" data-flow-action="play" aria-label="Play timeline">Play</button><button class="btn secondary" data-flow-action="next" aria-label="Next state">Next →</button><label for="flow-scrub" class="sr-only">Select lifecycle state</label><input id="flow-scrub" type="range" min="0" max="9" step="1" value="${state.flowStage}" aria-valuetext="${stages[state.flowStage][0]}"><output id="flow-count" for="flow-scrub">${state.flowStage+1} / 10</output></div><div class="flow-main"><div><div class="sectionline"><div><h2>Normal sequence</h2><p>Select a state directly. A new cycle requires a new proposal and applicable authority.</p></div></div><div class="flow-state-list" id="flow-state-list">${stages.map((v,i)=>`<button class="flow-stage ${i===state.flowStage&&state.flowException===null&&!state.flowObject?'active':''}" data-flow-stage="${i}" aria-pressed="${i===state.flowStage&&state.flowException===null&&!state.flowObject}"><span class="flow-number">${String(i+1).padStart(2,'0')}</span>${esc(v[0])}</button>`).join('')}</div><div class="sectionline"><div><h2>Exception routes</h2><p>Any normal state can branch here.</p></div></div><div class="flow-exceptions" id="flow-exceptions">${flowExceptions.map((v,i)=>`<button class="flow-exception ${state.flowException===i?'active':''}" data-flow-exception="${i}" aria-pressed="${state.flowException===i}">${esc(v[0])}</button>`).join('')}</div><p class="flow-status">The PDF names these exception states without prescribing one universal return route. A later transition needs its own authority and evidence.</p></div><section class="card flow-detail" aria-live="polite"><div class="label" id="flow-detail-label">${esc(d.label)}</div><h3 id="flow-detail-title">${esc(d.title)}</h3><p id="flow-detail-meaning">${esc(d.meaning)}</p><div class="label">What to check</div><p id="flow-detail-prompt">${esc(d.prompt)}</p><div id="flow-detail-refs">${refsMarkup(d.refs)}</div><a class="linkbtn" href="${PDF}" target="_blank" rel="noopener noreferrer" style="margin-top:17px">Read authoritative PDF ↗</a></section></div><div class="flow-catalog"><div class="sectionline"><div><h2>Find a parameter by name</h2><p>The text catalog selects the same 3D objects without requiring pointer precision.</p></div><span class="smallmeta" id="flow-catalog-count">${flowCatalogItems().length} visible</span></div><div class="flow-object-grid" id="flow-object-grid">${flowCatalogMarkup()}</div></div><div class="callout"><b>Learning model only:</b> Geometry, playback, and labels neither execute actions nor prove authority, evidence, test success, or HAIO-GATS conformance. The deposited PDF governs if a summary differs.</div>`}
const flowFields=fieldGroups.flatMap(([group,names])=>names.map(name=>({name,group})));
function flowCatalogItems(){const kinds=state.flowLayer==='all'?['control','field','test']:[state.flowLayer];return kinds.flatMap(kind=>{const items=kind==='control'?requirements:kind==='field'?flowFields:tests;return items.map((item,index)=>({kind,index,item}))})}
function flowCatalogMarkup(){return flowCatalogItems().map(({kind,index,item})=>{const key=kind+':'+index;const id=kind==='field'?item.name:item.id;const title=kind==='field'?item.group:item.title;return `<button data-flow-object="${key}" class="${state.flowObject===key?'active':''}" aria-pressed="${state.flowObject===key}"><strong>${esc(id)}</strong>${esc(title)}</button>`}).join('')}
function flowDetailData(){if(state.flowObject){const [kind,indexText]=state.flowObject.split(':');const index=Number(indexText);if(kind==='control'){const item=requirements[index];return {label:'CONTROL · MINIMUM LEVEL '+item.level,title:item.id+' · '+item.title,meaning:item.desc,prompt:'This labeled geometry is a requirement summary. Read the authoritative PDF for exact wording and conditions.',refs:[item.id]}}if(kind==='field'){const item=flowFields[index];return {label:'EV-02 EVENT FIELD · '+item.group,title:item.name,meaning:'A named field in the minimum material-event envelope.',prompt:'Field availability and unknown/not_applicable rules depend on the PDF conditions. This object holds no live event value.',refs:['EV-02']}}const item=tests[index];return {label:'CONFORMANCE TEST · MINIMUM LEVEL '+item.level,title:item.id+' · '+item.title,meaning:item.desc,prompt:'This object describes a prescribed challenge and required evidence. It does not run the test.',refs:[item.refs]}}const item=state.flowException===null?stages[state.flowStage]:flowExceptions[state.flowException];return {label:state.flowException===null?'STAGE '+(state.flowStage+1)+' OF 10':'EXCEPTION FROM STAGE '+(state.flowStage+1),title:item[0],meaning:item[1],prompt:item[2],refs:item[3]}}
function flowSelectObject(kind,index){stopFlow();state.flowObject=kind+':'+index;state.flowException=null;const p=flowObjectPosition(kind,index);state.flowYaw=Math.atan2(p[0],2.8);updateFlow()}
function flowSetMode(mode){state.flowMode=mode;updateFlow()}
function flowSetLayer(layer){state.flowLayer=layer;state.flowObject=null;state.flowYaw=0;updateFlow()}
function stopFlow(){flowPlaying=false;cancelAnimationFrame(flowRaf);flowElapsed=0;const b=$('flow-play');if(b){b.textContent='Play';b.setAttribute('aria-label','Play timeline')}}
function flowSelectStage(i,fromPlay=false){state.flowStage=Math.max(0,Math.min(9,i));state.flowException=null;state.flowObject=null;state.flowYaw=0;if(!fromPlay)stopFlow();updateFlow()}
function flowSelectException(i){stopFlow();state.flowException=i;state.flowObject=null;state.flowYaw=(i%2?-1:1)*Math.atan2(8.2,2.8);updateFlow()}
function flowTurn(direction){stopFlow();state.flowObject=null;state.flowException=null;if(direction==='reset')state.flowYaw=0;else state.flowYaw=(state.flowYaw+(direction==='right'?1:-1)*Math.PI/4+2*Math.PI)%(2*Math.PI);updateFlow()}
function updateFlow(){if(state.view!=='flow')return;const d=flowDetailData();$('flow-detail-label').textContent=d.label;$('flow-detail-title').textContent=d.title;$('flow-detail-meaning').textContent=d.meaning;$('flow-detail-prompt').textContent=d.prompt;$('flow-detail-refs').innerHTML=refsMarkup(d.refs);$('flow-scrub').value=state.flowStage;$('flow-scrub').setAttribute('aria-valuetext',stages[state.flowStage][0]);$('flow-count').textContent=(state.flowStage+1)+' / 10';$('flow-bearing').textContent='Heading '+Math.round(state.flowYaw*180/Math.PI)+'° · '+(state.flowObject?'inspecting '+d.title:state.flowException!==null?'exception '+d.title:'stage '+(state.flowStage+1)+' of 10');document.querySelectorAll('[data-flow-stage]').forEach(b=>{const active=Number(b.dataset.flowStage)===state.flowStage&&state.flowException===null&&!state.flowObject;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-flow-exception]').forEach(b=>{const active=Number(b.dataset.flowException)===state.flowException;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-flow-mode]').forEach(b=>{const active=b.dataset.flowMode===state.flowMode;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-flow-layer]').forEach(b=>{const active=b.dataset.flowLayer===state.flowLayer;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});$('flow-object-grid').innerHTML=flowCatalogMarkup();$('flow-catalog-count').textContent=flowCatalogItems().length+' visible';$('scene-status').textContent=state.flowObject?'Inspecting '+d.title:state.flowException!==null?'Viewing '+d.title:flowPlaying?'Traveling through the timeline':'At '+stages[state.flowStage][0]+' · press Play to move forward';if(flowScene&&window.X3D){try{const p=flowPositions[state.flowStage];flowScene.getNamedNode('TimelineMarker').translation=new X3D.SFVec3f(...p);for(const kind of ['control','field','test'])flowScene.getNamedNode(kind[0].toUpperCase()+kind.slice(1)+'Gallery').whichChoice=(state.flowLayer==='all'||state.flowLayer===kind)?0:-1;const selected=state.flowObject?state.flowObject.split(':'):null;const objectPos=selected?flowObjectPosition(selected[0],Number(selected[1])):null;const exceptionZ=state.flowException===null?null:-9*(state.flowException*2+1);const z=objectPos?objectPos[2]+2.8:exceptionZ!==null?exceptionZ+2.8:p[2]+4.5;flowCamera(z,state.flowYaw,objectPos&&selected[0]==='test'?2.1:1.7);if(state.flowMode==='overview')flowScene.getNamedNode('OverviewView').set_bind=true}catch(e){$('scene-status').textContent='3D navigation unavailable; text controls remain active.'}}}
function flowTick(now){if(!flowPlaying)return;if(flowLast){flowElapsed+=Math.min(now-flowLast,100);if(flowElapsed>=2200){flowElapsed-=2200;if(state.flowStage===9){flowCamera(flowPositions[9][2]-4.5,0);stopFlow();$('scene-status').textContent='Route complete · CLOSED passed';return}flowSelectStage(state.flowStage+1,true)}const nextZ=flowPositions[state.flowStage][2]+4.5-9*flowElapsed/2200;flowCamera(nextZ,0)}flowLast=now;flowRaf=requestAnimationFrame(flowTick)}
function flowPlay(){if(flowPlaying){stopFlow();return}if(state.flowStage===9)flowSelectStage(0);state.flowException=null;state.flowObject=null;updateFlow();flowPlaying=true;flowLast=0;flowElapsed=0;$('flow-play').textContent='Pause';$('flow-play').setAttribute('aria-label','Pause timeline');flowRaf=requestAnimationFrame(flowTick)}
function setupFlowScene(){flowScene=null;const canvas=$('flow-canvas');if(!canvas)return;function bind(){if(!canvas.isConnected)return;try{const sc=canvas.browser.currentScene;sc.getNamedNode('TimelineMarker');sc.getNamedNode('TravelerView');flowScene=sc;for(let i=0;i<10;i++)sc.getNamedNode('StageTouch'+i).addFieldCallback('flow-stage-'+i,'touchTime',()=>flowSelectStage(i));for(let i=0;i<5;i++)sc.getNamedNode('ExceptionTouch'+i).addFieldCallback('flow-exception-'+i,'touchTime',()=>flowSelectException(i));for(const [kind,count] of [['control',37],['field',25],['test',14]])for(let i=0;i<count;i++)sc.getNamedNode(kind[0].toUpperCase()+kind.slice(1)+'Touch'+i).addFieldCallback('flow-'+kind+'-'+i,'touchTime',()=>flowSelectObject(kind,i));$('scene-status').textContent='Inside the linear process · press Play to move forward';updateFlow()}catch(e){if(canvas.isConnected)$('scene-status').textContent='3D unavailable; the complete text catalog remains below.'}}canvas.addEventListener('load',bind);canvas.addEventListener('error',()=>{$('scene-status').textContent='3D scene failed to load; use the text catalog below.'});setTimeout(bind,1200)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.flowTurn){flowTurn(b.dataset.flowTurn);return}if(b.dataset.flowStage!==undefined){flowSelectStage(Number(b.dataset.flowStage));return}if(b.dataset.flowException!==undefined){flowSelectException(Number(b.dataset.flowException));return}if(b.dataset.flowObject){const [kind,index]=b.dataset.flowObject.split(':');flowSelectObject(kind,Number(index));return}if(b.dataset.flowMode){flowSetMode(b.dataset.flowMode);return}if(b.dataset.flowLayer){flowSetLayer(b.dataset.flowLayer);return}if(b.dataset.flowAction){if(b.dataset.flowAction==='play')flowPlay();else flowSelectStage(state.flowStage+(b.dataset.flowAction==='next'?1:-1))}});
document.addEventListener('input',e=>{if(e.target.id==='flow-scrub')flowSelectStage(Number(e.target.value))});

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){state.view=b.dataset.view;if(b.dataset.family)state.family=b.dataset.family;state.expanded=null;render();window.scrollTo({top:0,behavior:'instant'});return}if(b.dataset.family){state.family=b.dataset.family;state.expanded=null;render();return}if(b.dataset.level){state.level=b.dataset.level;state.expanded=null;render();return}if(b.dataset.req){state.expanded=state.expanded===b.dataset.req?null:b.dataset.req;render();return}if(b.dataset.stage!==undefined){state.stage=+b.dataset.stage;render();return}if(b.dataset.scenario){state.scenario=b.dataset.scenario==='next'?(state.scenario+1)%4:Math.max(0,state.scenario-1);render();return}});
document.addEventListener('input',e=>{if(e.target.id==='control-search'){const pos=e.target.selectionStart;state.query=e.target.value;render();let el=$('control-search');if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch(_){}}}});
// This client-side prototype deliberately has no network requests, persistence, or mutation endpoint.
render();
</script>
</body>
